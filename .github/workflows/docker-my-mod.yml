name: Docker image (my-mod)

# The fork's own image: every push to my-mod builds the Dockerfile and publishes it as
# ghcr.io/<owner>/support-fins:my-mod and :my-mod-<short sha>, for the owner's server to run.
# amd64 only, the server's platform. Upstream's workflows stay as they are (its image is
# published only on a release), so upstream changes merge in cleanly. "Run workflow" builds
# it again by hand.

on:
  push:
    branches: [my-mod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-my-mod
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish my-mod
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout my-mod
        uses: actions/checkout@v7

      - name: Short commit
        id: commit
        run: echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:my-mod
            ${{ env.IMAGE }}:my-mod-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Support Fins (my-mod)
            org.opencontainers.image.description=Browser-based breakaway support-fin generator for 3D prints - with SpaceMouse support through 3DxWare
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=my-mod
          cache-to: type=gha,scope=my-mod,mode=max
